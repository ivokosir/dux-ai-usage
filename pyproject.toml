[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dux-ai-usage"
version = "0.3.0"
description = "Dux Shell usage widget for multiple Claude and Codex subscriptions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "dux-ai-usage contributors"}]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
dux-ai-usage = "dux_ai_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
